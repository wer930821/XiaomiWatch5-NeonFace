name: Build latest APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "watchface/**"
      - "cyberwatchface/**"
      - "phone-updater/**"
      - "tools/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-latest.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: "1.0.${{ github.run_number }}"
      UPDATER_VERSION_CODE: 1000
      UPDATER_VERSION_NAME: "2.0.0"
      RELEASE_STORE_FILE: ${{ github.workspace }}/release-key.jks
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Generate animated watch background
        run: python tools/generate_dynamic_background.py

      - name: Generate high quality Cyber background
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageFile, ImageEnhance, ImageFilter
          import os

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          base = "cyberwatchface/src/main/res/drawable"
          src_path = f"{base}/cyber_concept_bg.jpg"
          gif_path = f"{base}/cyber_exact_anim.gif"
          thumb_path = f"{base}/cyber_exact_thumb.png"

          src = Image.open(src_path).convert("RGB").resize((480, 480), Image.Resampling.LANCZOS)

          frames = []
          for brightness, contrast in [(1.00, 1.10), (1.04, 1.14), (0.99, 1.08), (1.025, 1.12)]:
              frame = ImageEnhance.Brightness(src).enhance(brightness)
              frame = ImageEnhance.Contrast(frame).enhance(contrast)
              glow = frame.filter(ImageFilter.GaussianBlur(0.8))
              frame = Image.blend(frame, glow, 0.03)
              frames.append(frame)

          palette = frames[0].convert("P", palette=Image.Palette.ADAPTIVE, colors=256)
          pframes = [palette]
          for frame in frames[1:]:
              pframes.append(frame.quantize(palette=palette, dither=Image.Dither.FLOYDSTEINBERG))

          pframes[0].save(
              gif_path,
              save_all=True,
              append_images=pframes[1:],
              duration=320,
              loop=0,
              optimize=False,
              disposal=1,
          )
          src.save(thumb_path, optimize=True)

          size = os.path.getsize(gif_path)
          print(f"Cyber AGIF size: {size} bytes")
          if size < 50000:
              raise RuntimeError(f"Cyber AGIF unexpectedly small: {size} bytes")
          PY

      - name: Restore release keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build signed release APKs
        run: |
          gradle :watchface:assembleRelease :cyberwatchface:assembleRelease :phone-updater:assembleRelease

      - name: Prepare release files
        run: |
          cp watchface/build/outputs/apk/release/watchface-release.apk NeonCoreBlue-watch.apk
          cp cyberwatchface/build/outputs/apk/release/cyberwatchface-release.apk CyberNeonCity-watch.apk
          cp phone-updater/build/outputs/apk/release/phone-updater-release.apk NeonFace-Updater.apk
          cat > update-info.json <<EOF
          {
            "updaterVersionCode": ${UPDATER_VERSION_CODE},
            "updaterVersionName": "${UPDATER_VERSION_NAME}",
            "updaterApkUrl": "https://github.com/wer930821/XiaomiWatch5-NeonFace/releases/download/latest/NeonFace-Updater.apk",
            "cyberVersionCode": ${VERSION_CODE},
            "cyberVersionName": "${VERSION_NAME}",
            "cyberApkUrl": "https://github.com/wer930821/XiaomiWatch5-NeonFace/releases/download/latest/CyberNeonCity-watch.apk"
          }
          EOF

      - name: Upload test artifacts when signing is not configured
        if: env.RELEASE_KEYSTORE_BASE64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: neonface-test-apks
          path: |
            NeonCoreBlue-watch.apk
            CyberNeonCity-watch.apk
            NeonFace-Updater.apk
            update-info.json

      - name: Publish stable latest release
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest \
            NeonCoreBlue-watch.apk \
            CyberNeonCity-watch.apk \
            NeonFace-Updater.apk \
            update-info.json \
            --title "NeonFace Latest" \
            --notes "Automated build from ${GITHUB_SHA}" \
            --latest
