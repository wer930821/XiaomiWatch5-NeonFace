name: Build latest APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "watchface/**"
      - "phone-updater/**"
      - "tools/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-latest.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: "1.0.${{ github.run_number }}"
      RELEASE_STORE_FILE: ${{ github.workspace }}/release-key.jks
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Generate animated watch background
        run: python tools/generate_dynamic_background.py

      - name: Restore release keystore
        shell: bash
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Missing RELEASE_KEYSTORE_BASE64 secret"
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RELEASE_STORE_FILE"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build signed release APKs
        run: |
          gradle :watchface:assembleRelease :phone-updater:assembleRelease

      - name: Prepare release files
        run: |
          cp watchface/build/outputs/apk/release/watchface-release.apk NeonCoreBlue-watch.apk
          cp phone-updater/build/outputs/apk/release/phone-updater-release.apk NeonFace-Updater.apk

      - name: Publish stable latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest \
            NeonCoreBlue-watch.apk \
            NeonFace-Updater.apk \
            --title "NeonFace Latest" \
            --notes "Automated build from ${GITHUB_SHA}" \
            --latest
